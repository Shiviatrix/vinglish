[package]
name = "vinglish-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.vinglish]
path = "../crates/vinglish"

[dependencies.vinglish-lexer]
path = "../crates/vinglish-lexer"

[dependencies.vinglish-parser]
path = "../crates/vinglish-parser"

[[bin]]
name = "fuzz_lexer"
path = "fuzz_targets/fuzz_lexer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_parser"
path = "fuzz_targets/fuzz_parser.rs"
test = false
doc = false
bench = false
