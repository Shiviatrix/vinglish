name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  workspace:
    name: Rust and public checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Format check
        run: cargo fmt --check

      - name: Workspace test suite
        run: cargo test --workspace --quiet

      - name: Public smoke test
        run: ./tests/run_public_checks.sh
