name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.platform }} release binary
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            artifact_name: vng-linux-x86_64
          - os: macos-latest
            platform: macos-x86_64
            artifact_name: vng-macos-x86_64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --bin vng

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/vng dist/${{ matrix.artifact_name }}
          chmod +x dist/${{ matrix.artifact_name }}
          shasum -a 256 dist/${{ matrix.artifact_name }} > dist/${{ matrix.artifact_name }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
