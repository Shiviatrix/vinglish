[workspace]
members = [
    "crates/vinglish",
    "crates/vinglish-lexer",
    "crates/vinglish-parser",
    "crates/vinglish-types",
    "crates/vinglish-ownership",
    "crates/vinglish-diagnostics",
    "crates/vinglish-codegen",
    "crates/vinglish-fmt",
    "crates/vinglish-hir", "crates/vinglish-mir", "crates/vinglish-opt", "crates/vinglish-own", "crates/vinglish-ssa", "crates/vinglish-analysis", "crates/vinglish-llvm", "crates/vinglish-lsp", "rt_rust", "crates/vinglish-macro",
    "crates/vinglish-ir-export",
    "crates/vinglish-decompile",
]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
rust-version = "1.96.1"
version = "0.2.1"
edition = "2024"
authors = ["The Vinglish Team"]
license = "MIT"
description = "The Vinglish intent-aware systems programming language"

[workspace.dependencies]
thiserror       = "2.0"
clap            = { version = "4", features = ["derive"] }
indexmap        = "2"
strsim          = "0.11"
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
